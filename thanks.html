<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You!</title>
    <link rel="stylesheet" href="thanks.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="loader" class="loader-container">
        <div class="loader"></div>
        <p>Processing your request...</p>
    </div>

    <div id="thank-you-container" class="thank-you-container hidden">
        <div class="thank-you-content">
            <div class="icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h1 class="slide-in">Thank You!</h1>
            <p class="slide-in">Your message has been successfully sent. I appreciate you reaching out to me!</p>
            <p class="slide-in">I'll get back to you within 24 hours. If you need immediate assistance, feel free to contact me again.</p>
            <div class="buttons">
                <a href="index.html" class="btn home-btn pulse">Return to Home</a>
                
            </div>
        </div>
    </div>

    <script src="thanks.js"></script>
</body>
</html>
